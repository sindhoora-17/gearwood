<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-container">

    <a class="back-link" th:href="@{/account}">← Back to Account</a>

    <div class="card">
        <h1>Order History</h1>

        <div th:if="${orders.isEmpty()}">
            <p>You have no orders yet.</p>
        </div>

        <div th:if="${!orders.isEmpty()}">

            <div class="order-card" th:each="order : ${orders}">

                <div>
                    <p>
                        <strong>Order #</strong>
                        <span th:text="${order.orderNumber}"></span>
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span th:text="${order.status}"></span>
                    </p>

                    <a class="order-details-link"
                       th:href="@{'/account/orders/' + ${order.orderNumber}}">
                        View Details
                    </a>
                </div>

                <div class="order-card-right">
                    <p th:text="${order.orderDateTime.toLocalDate()}"></p>
                    <strong th:text="'$' + ${order.totalAmount}"></strong>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
