<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page">

    <div class="auth-card sample-auth-card">

        <a class="back-link" th:href="@{/account}">
            ← Back to Account
        </a>

        <h1>Change Password</h1>

        <div class="error-banner" th:if="${error}">
            <p th:text="${error}"></p>
        </div>

        <div class="success-banner" th:if="${success}">
            <p th:text="${success}"></p>
        </div>

        <form method="post" th:action="@{/account/change-password}">

            <div class="form-row">
                <label>Current Password</label>
                <input name="currentPassword"
                       placeholder="Enter your current password"
                       type="password">
            </div>

            <div class="form-row">
                <label>New Password</label>
                <input name="newPassword"
                       placeholder="Enter your new password"
                       type="password">
            </div>

            <div class="form-row">
                <label>Confirm New Password</label>
                <input name="confirmNewPassword"
                       placeholder="Confirm your new password"
                       type="password">
            </div>

            <button class="sample-login-btn" type="submit">
                Update Password
            </button>
            <a class="cancel-link" th:href="@{/account}">Cancel</a>

        </form>

    </div>

</div>

</body>
</html>
